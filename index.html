    <title>Giáo Viên Sáng Tạo - Sáng tạo học liệu, Kết nối tri thức</title>
    <script>
      // Suppress and intercept harmless Vite HMR WebSocket connection attempts in cloud iframe sandbox
      (function() {
        if (typeof window !== 'undefined') {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('vite') || url.includes('@vite')))
              ) {
                return {
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  send: function() {},
                  close: function() {},
                  readyState: 3, // CLOSED
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
          }

          window.addEventListener('error', function(event) {
            var msg = event && event.message ? String(event.message) : '';
            var file = event && event.filename ? String(event.filename) : '';
            if (
              msg.includes('WebSocket') ||
              msg.includes('createWebSocketModuleRunnerTransport') ||
              file.includes('@vite/client') ||
              file.includes('vite/client')
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : '';
            if (
              reason.includes('WebSocket') ||
              reason.includes('createWebSocketModuleRunnerTransport') ||
              reason.includes('@vite/client')
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);
        }
      })();
    </script>
